[package]
name = "termage"
version = "4.0.0"
authors = ["Calum Forster <calumforster@live.co.uk>"]
edition = "2021"
readme = "README.md"
keywords = ["terminal", "image", "gif", "view", "termage"]
categories = ["command-line-utilities", "multimedia::images"]
repository = "https://github.com/calum/terminal_image_display"
homepage = "https://calum.github.io/terminal_image_display/"
license = "MIT OR Apache-2.0"
description = "Display images, animated gifs and videos in the terminal!"
exclude = ["docs/*", "examples/*", ".github/*", "CLAUDE.md"]

[[bin]]
name = "termage"
path = "src/bin/main.rs"
doc = false

[lib]
name = "termage"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
terminal_graphics = "1"
terminal_size = "0.4"
ureq = { version = "3", optional = true }

[features]
default = ["net"]
# Loading from http(s) addresses. Turn it off (as the website build does) to
# compile for WebAssembly, where there is no socket API.
net = ["dep:ureq"]

# The termage library compiled to WebAssembly for the website's terminal.
[[example]]
name = "web"
path = "examples/web.rs"
crate-type = ["cdylib"]
test = true
