name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      # ffmpeg lets the video test run for real (it is skipped without it)
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets
      - run: cargo test --all-targets
      - run: cargo test --doc
      # the website build: no network feature, compiled for the browser
      - run: cargo test --no-default-features --all-targets
      - run: cargo build --release --example web --no-default-features --target wasm32-unknown-unknown
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --fail-under-lines 85

  # Publishes to crates.io when master has a version that is not yet released.
  # To release: bump `version` in Cargo.toml in your PR. Merges that leave the
  # version unchanged skip publishing, so this never fails on re-runs.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check whether this version is already published
        id: version
        run: |
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "$name-ci (github.com/${{ github.repository }})" \
            "https://crates.io/api/v1/crates/$name/$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$status" = "200" ]; then
            echo "$name $version is already on crates.io, skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "unexpected crates.io status $status" >&2
            exit 1
          fi
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Tag release
        if: steps.version.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

  # Builds the command line tool for each platform when master has a version
  # that has no GitHub release yet.
  plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, coverage]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v$version already has a GitHub release, skipping"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # The file names are what `termage --update` and the install scripts download.
  binaries:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --bin termage --target ${{ matrix.target }}
      - name: Name the file
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/termage${{ matrix.suffix }}" \
            "dist/termage-${{ matrix.target }}${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: termage-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Creates the vX.Y.Z tag (if the publish job has not already) and a GitHub
  # release with every binary and a checksum file. The install scripts live on
  # the website (see pages.yml) and fetch these files.
  release:
    needs: [plan, publish, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: termage-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum termage-* > SHA256SUMS
      - name: Create the release
        run: |
          gh release create "v${{ needs.plan.outputs.version }}" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "termage ${{ needs.plan.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
